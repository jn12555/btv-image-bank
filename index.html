<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BTV Image Bank</title>
<style>
:root{color-scheme:light dark;--bg:#f5f4f0;--card:#fff;--ink:#1b2127;--muted:#5d6872;--ring:rgba(0,0,0,.12);--accent:#00599c;--err:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#121518;--card:#1b2025;--ink:#e9edf0;--muted:#9aa6b0;--ring:rgba(255,255,255,.12);--accent:#6cb4ea;--err:#e66767}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;padding:16px}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--ring);border-radius:16px;padding:24px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--muted);font-size:14px;margin:0 0 18px}
input{width:100%;height:46px;border:1px solid var(--ring);border-radius:10px;padding:0 12px;font:inherit;background:transparent;color:inherit;letter-spacing:.04em}
button{width:100%;height:46px;margin-top:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}#msg{min-height:20px;margin-top:10px;font-size:14px;color:var(--err)}
label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:12px}label input{width:auto;height:auto}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>BTV Image Bank</h1>
  <p>Internal working version. Enter the password to open it.</p>
  <input id="pw" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Password" aria-label="Password" required>
  <label><input type="checkbox" id="keep"> Remember on this device for this session</label>
  <button id="go" type="submit">Open</button>
  <div id="msg" role="alert"></div>
</form>

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.trim()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.iv) }, key, u8(P.data));
  const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
